http:
  middlewares:
    oidc-auth:
      plugin:
        traefik-oidc-auth:
          Secret: {{ env "SECRET_SALT" | quote }}
          Provider:
            Url: "https://sso.lr-projects.de"
            ClientId: {{ env "CLIENT_ID" | quote }}
            ClientSecret: {{ env "CLIENT_SECRET" | quote }}
          Scopes: ["openid", "profile", "email"]
