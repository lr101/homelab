version: 2
backends:
  local:
    type: local
    path: /backup
  nas:
    type: sftp
    path: nas:/backup_medion
global:
  forget:
    keep-last: 5
    keep-daily: 7
    keep-weekly: 4
    keep-monthly: 12
    keep-yearly: 7
monitors:
  stats:
    type: influx
locations:
  docker-tags:
    from:
    - ./.backup
    to:
    - local
    - nas
    monitors:
    - stats
    forget: prune
    hooks:
      before: /hooks/docker-tags-hook.sh
  immich:
    from:
    - ./immich-app
    - /external/immich-upload
    to:
    - local
    - nas
    monitors:
    - stats
    forget: prune
    options:
      backup:
        exclude:
        - '*/postgres/*'
        - '*/library/thumbs/*'
        - '*/library/encoded-video/*'
    hooks:
      before:
      - python3 /hooks/backup_dump.py /data/immich-app/.backup/immich.dump docker
        exec -u postgres immich_postgres sh -c 'exec pg_dump -U "$POSTGRES_USER" -Fc
        "$POSTGRES_DB"'
  jellyfin:
    from:
    - ./jellyfin
    to:
    - local
    - nas
    monitors:
    - stats
  logging:
    from:
    - ./logging
    to:
    - local
    - nas
    monitors:
    - stats
    forget: prune
    options:
      backup:
        exclude:
        - '*/influx_backup/*'
        - '*/influx/influx_data/*'
        - '*/prometheus/data/*'
  nextcloud:
    from:
    - ./nextcloud
    to:
    - local
    - nas
    monitors:
    - stats
    forget: prune
    options:
      backup:
        exclude:
        - '*/elasticsearch_data/*'
    hooks:
      before:
      - docker exec -u www-data nextcloud-nextcloud-1 /var/www/html/occ maintenance:mode  --on
      - python3 /hooks/mariadb-hook.py nextcloud-database-1 nextcloud --folder /data/nextcloud --password-file /data/nextcloud/.secrets/db_root_password
      after:
      - docker exec -u www-data nextcloud-nextcloud-1 /var/www/html/occ maintenance:mode  --off
      failure:
      - docker exec -u www-data nextcloud-nextcloud-1 /var/www/html/occ maintenance:mode  --off
  pocketid:
    from:
    - ./pocket-id
    to:
    - local
    - nas
    forget: prune
    monitors:
    - stats
  stick-it-homepage:
    from:
    - ./stick-it-homepage
    to:
    - local
    - nas
    forget: prune
    monitors:
    - stats
  traefik:
    from:
    - ./traefik
    to:
    - local
    - nas
    forget: prune
    monitors:
    - stats
  adguard:
    from:
    - ./adguard
    to:
    - local
    - nas
    forget: prune
    monitors:
    - stats
  actual-budget:
    from:
    - ./actual-budget
    to:
    - local
    - nas
    monitors:
    - stats
    forget: prune
    hooks:
      before:
      - docker stop budget
      after:
      - docker start budget
      failure:
      - docker start budget
  hiring_scraper:
    from:
    - ./hiring_scraper
    to:
    - local
    - nas
    monitors:
    - stats
    forget: prune
    hooks:
      before:
      - python3 /hooks/backup_dump.py /data/hiring_scraper/.backup/jobs.dump docker
        exec -u postgres hiring-scraper-db-1 sh -c 'exec pg_dump -U "$POSTGRES_USER"
        -Fc "$POSTGRES_DB"'
