x-bootstrap: &bootstrap
  image: ${HIRING_APP_IMAGE:?Set HIRING_APP_IMAGE to the verified Radius app image}
  env_file:
    - path: .env
      required: false
    - path: .secrets.env
      format: raw
  environment:
    RADIUS_CODEX_STATE_DIR: /var/lib/radius/codex
  volumes:
    - ./.secrets/app-bootstrap.env:/run/app-bootstrap.env:ro
    - ./radius_codex:/var/lib/radius/codex
  networks:
    - backend

x-runtime: &runtime
  <<: *bootstrap
  depends_on:
    migrate:
      condition: service_completed_successfully
  init: true
  restart: unless-stopped
  security_opt:
    - apparmor=${HIRING_APPARMOR_PROFILE:-unconfined}
    - seccomp=./docker/chromium-seccomp.json

x-worker: &worker
  <<: *runtime
  restart: on-failure

services:
  db:
    image: ${HIRING_DB_IMAGE:?Set HIRING_DB_IMAGE to the verified Radius database image}
    restart: unless-stopped
    env_file:
    - path: .env
      required: false
    - path: .secrets.env
      format: raw
    volumes:
      - ./hiring_db:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d hiring"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    <<: *bootstrap
    command: ["--migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *runtime
    command: ["--api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - frontend
      - backend
    labels:
      - traefik.enable=true
      - traefik.docker.network=frontend
      - traefik.http.routers.hiring-scraper.rule=Host(`jobs.medion.lr-projects.de`)
      - traefik.http.routers.hiring-scraper.entrypoints=websecure
      - traefik.http.routers.hiring-scraper.tls=true
      - traefik.http.routers.hiring-scraper.tls.certresolver=cloudflare
      - traefik.http.routers.hiring-scraper.service=hiring-scraper-svc
      - traefik.http.services.hiring-scraper-svc.loadbalancer.server.port=8000

  worker:
    <<: *worker
    command: ["--worker", "worker"]

  discovery-worker:
    <<: *worker
    command: ["--worker", "discovery_worker"]

  search-snapshot-worker:
    <<: *worker
    command: ["--worker", "search_snapshot_worker"]

  profile-match-worker:
    <<: *worker
    command: ["--worker", "profile_match_worker"]

  semantic-search-worker:
    <<: *worker
    command: ["--worker", "semantic_search_worker"]

  application-preparation-worker:
    <<: *worker
    command: ["--worker", "application_preparation_worker"]

networks:
  backend:
  frontend:
    external: true

