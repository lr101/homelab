services:
  db:
    image: ghcr.io/lr101/hiring-scraper/hiring-scraper:db-latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./hiring_db:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d hiring"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s


  app:
    image: ghcr.io/lr101/hiring-scraper/hiring-scraper:latest
    env_file: .env
    volumes:
      - .env:/run/app-bootstrap.env:ro
      - ./radius_codex:/var/lib/radius/codex
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - frontend
      - backend
    labels:
      - traefik.enable=true
      - traefik.docker.network=frontend
      - traefik.http.routers.hiring-scraper.rule=Host(`jobs.medion.lr-projects.de`)
      - traefik.http.routers.hiring-scraper.entrypoints=websecure
      - traefik.http.routers.hiring-scraper.tls=true
      - traefik.http.routers.hiring-scraper.tls.certresolver=cloudflare
      - traefik.http.routers.hiring-scraper.service=hiring-scraper-svc
      - traefik.http.services.hiring-scraper-svc.loadbalancer.server.port=8000

networks:
  backend:
  frontend:
    external: true

