services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: always
    env_file: .env
    ports:
    - 443:443
    - 80:80
    extra_hosts:
    - host.docker.internal:host-gateway
    annotations:
    - de.lr-projects.description=Reverse Proxy (with https)
    - de.lr-projects.sso=true
    networks:
    - frontend
    - docker-api
    labels:
    - com.centurylinklabs.watchtower.enable=true
    volumes:
    - ./traefik.yml:/etc/traefik/traefik.yaml:ro
    - ./dynamic:/etc/traefik/dynamic
    - ./certificates:/etc/traefik/certificates
    - ./traefik-logs:/logs
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 200M
        reservations:
          cpus: '0.2'
          memory: 128M
    depends_on:
      socket-proxy:
        condition: service_started
    environment:
      SECRET_SALT: ${SECRET_SALT:?Set SECRET_SALT in the Traefik .env}
      CLIENT_ID: ${CLIENT_ID:?Set CLIENT_ID in the Traefik .env}
      CLIENT_SECRET: ${CLIENT_SECRET:?Set CLIENT_SECRET in the Traefik .env}
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    env_file: .env
    annotations:
    - de.lr-projects.description=Security monitoring
    - de.lr-projects.sso=false
    networks:
    - frontend
    labels:
    - com.centurylinklabs.watchtower.enable=true
    environment:
    - BOUNCER_KEY_TRAEFIK=$CROWDSEC_BOUNCER_API_KEY
    - COLLECTIONS=crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
    volumes:
    - ./crowdsec/data:/var/lib/crowdsec/data
    - ./crowdsec/etc:/etc/crowdsec
    - ./traefik-logs:/var/log/traefik:ro
    - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml
    - ./crowdsec/allowlist:/etc/crowdsec/parsers/s02-enrich
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: '1'
      EVENTS: '1'
      PING: '1'
      VERSION: '1'
      POST: '0'
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
    - docker-api
    security_opt:
    - no-new-privileges:true
networks:
  frontend:
    external: true
  docker-api:
    internal: true
