services:
  t3-code:
    build: .
    container_name: t3-code-server
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    security_opt:
      - seccomp=./seccomp-browser.json
    environment:
      - T3CODE_HOST=0.0.0.0
      - T3CODE_PORT=8080
      # Suppress opening the server UI on startup; agent browser tabs still work.
      - T3CODE_NO_BROWSER=true
      - T3CODE_SERVER_BROWSER_SANDBOX=1
      - GH_TOKEN=${GITHUB_SECRET}
    volumes:
      - ./workspace:/workspace
      - ./t3-data:/home/node/.t3
      - ./codex-data:/home/node/.codex
      - ./codex-data-eli:/home/node/.codex_p
      - ./mise-data:/opt/mise
      - ./skills:/home/node/.agents/skills
    networks:
      - frontend
    env_file: .env
    labels:
      # Traefik configuration
      - traefik.enable=true
      - traefik.docker.network=frontend
      - traefik.http.routers.t3code.rule=Host(`code.dell.lr-projects.de`)
      - traefik.http.routers.t3code.entrypoints=websecure
      - traefik.http.routers.t3code.tls=true
      - traefik.http.routers.t3code.tls.certresolver=cloudflare
      - traefik.http.routers.t3code.service=t3code-svc
      - traefik.http.services.t3code-svc.loadbalancer.server.port=8080

      - 'traefik.http.routers.dev-worktrees.rule=Host(`*.dev.dell.lr-projects.de`)'
      - "traefik.http.routers.dev-worktrees.entrypoints=websecure"
      - "traefik.http.routers.dev-worktrees.tls=true"
      - "traefik.http.routers.dev-worktrees.tls.certresolver=cloudflare"
      - "traefik.http.routers.dev-worktrees.tls.domains[0].main=*.dev.dell.lr-projects.de"
      - "traefik.http.routers.dev-worktrees.service=dev-worktrees"
      - "traefik.http.services.dev-worktrees.loadbalancer.server.port=18080"
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true

    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 1G

networks:
  frontend:
    external: true
