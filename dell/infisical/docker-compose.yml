name: infisical

services:
  infisical:
    image: infisical/infisical:v0.167.8
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '8080'
      SITE_URL: https://secrets.dell.lr-projects.de
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run the Infisical bootstrap command first}
      AUTH_SECRET: ${AUTH_SECRET:?Run the Infisical bootstrap command first}
      DB_CONNECTION_URI: postgresql://infisical:${INFISICAL_DB_PASSWORD:?Set INFISICAL_DB_PASSWORD}@db:5432/infisical
      REDIS_URL: redis://redis:6379
      TELEMETRY_ENABLED: 'false'
      # Only trust proxy addresses on Docker networks; no directly published API port.
      TRUSTED_PROXY_CIDRS: ${INFISICAL_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    labels:
      - traefik.enable=true
      - traefik.docker.network=frontend
      - traefik.http.routers.infisical.rule=Host(`secrets.dell.lr-projects.de`)
      - traefik.http.routers.infisical.entrypoints=websecure
      - traefik.http.routers.infisical.tls=true
      - traefik.http.routers.infisical.tls.certresolver=cloudflare
      - traefik.http.routers.infisical.middlewares=infisical-vpn@file
      - traefik.http.services.infisical.loadbalancer.server.port=8080
      - com.centurylinklabs.watchtower.enable=false
    annotations:
      - de.lr-projects.description=Central secret management with native user and machine authentication
      - de.lr-projects.sso=false
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:8080/api/status").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G

  db:
    image: postgres:16-alpine
    container_name: infisical-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: infisical
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${INFISICAL_DB_PASSWORD:?Run the Infisical bootstrap command first}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U infisical -d infisical']
      interval: 5s
      timeout: 5s
      retries: 20
    labels:
      - com.centurylinklabs.watchtower.enable=false

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./redis:/data
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    labels:
      - com.centurylinklabs.watchtower.enable=false

networks:
  frontend:
    external: true
  backend:
    internal: true
