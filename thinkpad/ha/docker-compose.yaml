services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
    - ./config:/config
    - /etc/localtime:/etc/localtime:ro
    - /run/dbus:/run/dbus:ro
    - ./backup:/backup
    restart: unless-stopped
    privileged: true
    network_mode: host
    labels:
    - traefik.enable=true
    - traefik.http.routers.ha.rule=Host(`ha.thinkpad.lr-projects.de`)
    - traefik.http.routers.ha.entrypoints=websecure
    - traefik.http.routers.ha.tls=true
    - traefik.http.routers.ha.tls.certresolver=cloudflare
    - traefik.http.services.ha.loadbalancer.server.port=8123
    - com.centurylinklabs.watchtower.enable=true
    annotations:
    - de.lr-projects.description=Home automation platform
    - de.lr-projects.sso=true
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 768M
  mariadb:
    image: mariadb:12
    container_name: mariadb
    restart: unless-stopped
    environment:
      MARIADB_AUTO_UPGRADE: '1'
      MARIADB_DATABASE: ${MARIADB_DATABASE:-homeassistant}
      MARIADB_USER: ${MARIADB_USER:-homeassistant}
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
    volumes:
    - ./mariadb:/var/lib/mysql
    ports:
    - 127.0.0.1:3306:3306
    annotations:
    - de.lr-projects.description=MariaDB database for Home Assistant
    labels:
    - com.centurylinklabs.watchtower.enable=true
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    secrets:
    - db_root_password
    - db_password
secrets:
  db_root_password:
    file: ./.secrets/db_root_password
  db_password:
    file: ./.secrets/db_password
